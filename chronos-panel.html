<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Deck</title>
    <style>
        /* --- FUENTES DE NUESTRA MARCA --- */
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Roboto+Mono:wght@300;400&display=swap');

        /* --- ESTILO GENERAL --- */
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- EL CHASIS PRINCIPAL --- */
        .obsidian-deck {
            display: flex;
            justify-content: space-around;
            align-items: stretch; /* Asegura que todos los módulos tengan la misma altura */
            width: 100%;
            max-width: 1200px;
            padding: 25px 20px;
            background-color: rgba(10, 10, 10, 0.5); /* Fondo negro semitransparente */
            border: 1px solid #222;
            border-radius: 12px; /* Bordes un poco más pronunciados */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        /* --- CADA MÓDULO DE RELOJ INDIVIDUAL --- */
        .clock-module {
            text-align: center;
            flex-grow: 1;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- ESTILO DEL NOMBRE DE LA UBICACIÓN --- */
        .location-name {
            font-family: 'Lora', serif;
            font-size: 1.1em;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #AA8A5A; /* Oro Cepillado para el título */
            margin-bottom: 20px;
            opacity: 0.9;
        }

        /* --- ESTILO DE LA HORA (REFINADO) --- */
        .time {
            font-family: 'Roboto Mono', monospace; /* <-- CAMBIO CLAVE: Volvemos a la elegancia */
            font-size: 2.5em; /* <-- CAMBIO CLAVE: Tamaño reducido y profesional */
            font-weight: 400; /* Un poco más de peso para claridad */
            color: #EAEAEA; /* Un blanco ligeramente menos brillante */
            /* <-- CAMBIO CLAVE: Efecto de brillo sutil, no un neón */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
            line-height: 1; /* Ajusta el espaciado vertical */
        }
        
        /* --- ESTILO DE LA FECHA (REINTRODUCIDA) --- */
        .date {
            font-family: 'Roboto Mono', monospace;
            font-weight: 300;
            font-size: 0.9em;
            color: #F1F1F1;
            opacity: 0.5; /* Muy sutil para no competir con la hora */
            margin-top: 15px;
        }

    </style>
</head>
<body>

    <div class="obsidian-deck">
        <div class="clock-module">
            <div class="location-name">Tokio</div>
            <div id="tokio-time" class="time"></div>
            <div id="tokio-date" class="date"></div>
        </div>
        <div class="clock-module">
            <div class="location-name">London</div>
            <div id="london-time" class="time"></div>
            <div id="london-date" class="date"></div>
        </div>
        <div class="clock-module">
            <div class="location-name">New York</div>
            <div id="ny-time" class="time"></div>
            <div id="ny-date" class="date"></div>
        </div>
    </div>

    <script>
        function updateClock(timeElementId, dateElementId, timezone) {
            const now = new Date(new Date().toLocaleString('en-US', { timeZone: timezone }));
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0'); // Volvemos a añadir segundos
            
            const day = now.toLocaleDateString('en-US', { weekday: 'short' });
            const month = now.toLocaleDateString('en-US', { month: 'short' });
            const dayNum = now.getDate();

            document.getElementById(timeElementId).textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById(dateElementId).textContent = `${day}, ${month} ${dayNum}`;
        }

        function initializeClocks() {
            updateClock('tokio-time', 'tokio-date', 'Asia/Tokyo');
            updateClock('london-time', 'london-date', 'Europe/London');
            updateClock('ny-time', 'ny-date', 'America/New_York');
        }

        setInterval(initializeClocks, 1000);
        initializeClocks();
    </script>

</body>
</html>
