<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Sessions Panel</title>
    <style>
        /* --- FUENTES DE NUESTRA MARCA --- */
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Roboto+Mono:wght@300&display=swap');

        /* --- ESTILO GENERAL --- */
        body {
            background-color: transparent;
            color: #F1F1F1; /* Blanco Hueso */
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- CONTENEDOR PRINCIPAL DEL PANEL --- */
        .main-container {
            width: 100%;
            padding: 20px 0; /* Añade espacio vertical */
            display: flex;
            flex-direction: column; /* Organiza las filas verticalmente */
            gap: 60px; /* Espacio generoso entre la fila de arriba y la de abajo */
        }

        /* --- ESTILO PARA CADA FILA DE RELOJES --- */
        .row {
            display: flex;
            justify-content: space-around; /* Distribuye los relojes uniformemente en la fila */
            align-items: center;
        }

        /* --- CONTENEDOR DE CADA RELOJ INDIVIDUAL --- */
        .clock-container {
            text-align: center;
        }

        /* --- ESTILO DE LOS TÍTULOS (ESTÁNDAR OBSIDIANA) --- */
        .clock-container h2 {
            font-family: 'Lora', serif; /* Nuestra fuente de Prestigio */
            font-weight: 500;
            font-size: 1.1em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #AA8A5A; /* Nuestro Oro Cepillado */
            margin: 0 0 25px 0; /* Espacio solo debajo del título */
        }

        /* --- ESTILO DEL RELOJ DIGITAL --- */
        .time {
            font-size: 2.2em;
            font-weight: 300;
            letter-spacing: 1px; /* Un poco menos de espacio para elegancia */
        }
        .date {
            font-size: 0.9em;
            opacity: 0.7;
            margin-top: 8px; /* Un poco más de espacio */
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Fila Superior: 3 Relojes -->
        <div class="row">
            <div class="clock-container">
                <h2>Tokio</h2>
                <div id="tokio-time" class="time"></div>
                <div id="tokio-date" class="date"></div>
            </div>
            <div class="clock-container">
                <h2>London</h2>
                <div id="london-time" class="time"></div>
                <div id="london-date" class="date"></div>
            </div>
            <div class="clock-container">
                <h2>New York</h2>
                <div id="ny-time" class="time"></div>
                <div id="ny-date" class="date"></div>
            </div>
        </div>

        <!-- Fila Inferior: 2 Relojes -->
        <div class="row">
            <div class="clock-container">
                <h2>España</h2>
                <div id="spain-time" class="time"></div>
                <div id="spain-date" class="date"></div>
            </div>
            <div class="clock-container">
                <h2>México</h2>
                <div id="mexico-time" class="time"></div>
                <div id="mexico-date" class="date"></div>
            </div>
        </div>
    </div>

    <script>
        // El JavaScript no necesita cambios, funciona igual.
        function updateClock(timeElementId, dateElementId, timezone) {
            const now = new Date(new Date().toLocaleString('en-US', { timeZone: timezone }));
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const day = now.toLocaleDateString('en-US', { weekday: 'short' });
            const month = now.toLocaleDateString('en-US', { month: 'short' });
            const dayNum = now.getDate();
            document.getElementById(timeElementId).textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById(dateElementId).textContent = `${day}, ${month} ${dayNum}`;
        }
        function initializeClocks() {
            updateClock('tokio-time', 'tokio-date', 'Asia/Tokyo');
            updateClock('london-time', 'london-date', 'Europe/London');
            updateClock('ny-time', 'ny-date', 'America/New_York');
            updateClock('spain-time', 'spain-date', 'Europe/Madrid');
            updateClock('mexico-time', 'mexico-date', 'America/Mexico_City');
        }
        setInterval(initializeClocks, 1000);
        initializeClocks();
    </script>

</body>
</html>
