<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body {
            background-color: transparent; margin: 0; padding: 0; overflow: hidden; display: flex;
            justify-content: center; align-items: center; height: 100vh;
        }
        .vertex-panel {
            display: flex; justify-content: space-around; align-items: stretch; width: 100%;
            max-width: 1200px; padding: 25px 20px; background-color: #121212; /* Base: Negro Carbono */
            border: 1px solid #333; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .clock-module {
            text-align: center; flex-grow: 1; padding: 0 20px; display: flex;
            flex-direction: column; justify-content: center;
        }
        .location-name {
            font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1em;
            letter-spacing: 2px; text-transform: uppercase; color: #888888; /* Acento Secundario: Gris Medio */
            margin-bottom: 20px;
        }
        .time {
            font-family: 'Poppins', sans-serif; font-size: 2.5em; font-weight: 600;
            color: #AFFF00; /* Acento Principal: Verde Lima Eléctrico */
            text-shadow: 0 0 10px rgba(175, 255, 0, 0.3);
            line-height: 1;
        }
        .date {
            font-family: 'Poppins', sans-serif; font-weight: 400; font-size: 0.9em;
            color: #888888; opacity: 0.8; margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="vertex-panel">
        <div class="clock-module"><div class="location-name">Tokio</div><div id="tokio-time" class="time"></div><div id="tokio-date" class="date"></div></div>
        <div class="clock-module"><div class="location-name">London</div><div id="london-time" class="time"></div><div id="london-date" class="date"></div></div>
        <div class="clock-module"><div class="location-name">New York</div><div id="ny-time" class="time"></div><div id="ny-date" class="date"></div></div>
    </div>
    <script>
        function updateClock(timeElementId, dateElementId, timezone) { const now = new Date(new Date().toLocaleString('en-US', { timeZone: timezone })); const hours = String(now.getHours()).padStart(2, '0'); const minutes = String(now.getMinutes()).padStart(2, '0'); const seconds = String(now.getSeconds()).padStart(2, '0'); const day = now.toLocaleDateString('en-US', { weekday: 'short' }); const month = now.toLocaleDateString('en-US', { month: 'short' }); const dayNum = now.getDate(); document.getElementById(timeElementId).textContent = `${hours}:${minutes}:${seconds}`; document.getElementById(dateElementId).textContent = `${day}, ${month} ${dayNum}`; }
        function initializeClocks() { updateClock('tokio-time', 'tokio-date', 'Asia/Tokyo'); updateClock('london-time', 'london-date', 'Europe/London'); updateClock('ny-time', 'ny-date', 'America/New_York'); }
        setInterval(initializeClocks, 1000); initializeClocks();
    </script>
</body>
</html>
