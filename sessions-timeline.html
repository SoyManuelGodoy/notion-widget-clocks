<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sessions Gantt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            background-color: transparent; margin: 0; font-family: 'Roboto Mono', monospace;
            color: #EAEAEA; overflow: hidden; display: flex; justify-content: center;
            align-items: center; height: 100vh;
        }

        .gantt-container {
            width: 100%; height: 100%; max-width: 1200px; padding: 25px 40px;
            box-sizing: border-box; background-color: rgba(10, 10, 10, 0.7);
            border: 1px solid #282828; border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex; flex-direction: column;
        }
        
        .panel-title {
            font-family: 'Lora', serif; font-size: 1.2em; letter-spacing: 3px;
            text-transform: uppercase; color: #AA8A5A; text-align: center;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #282828;
        }

        .timeline-area {
            position: relative; width: 100%; flex-grow: 1;
        }

        .sessions-grid {
            position: relative; height: 80%;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: calc(100% / 24) 100%; /* Una línea por cada hora */
        }

        .session-bar {
            position: absolute; height: 30px; background-color: #333;
            border-radius: 4px; display: flex; align-items: center;
            padding-left: 10px; box-sizing: border-box; font-family: 'Lora', serif;
            font-size: 0.8em; color: #EAEAEA;
        }
        
        .overlap {
            background-color: #E5E4E2; color: #111; font-weight: bold; z-index: 10;
        }

        .current-time-indicator {
            position: absolute; top: 0; height: 80%; width: 2px;
            background-color: #AA8A5A; box-shadow: 0 0 10px #AA8A5A; z-index: 20;
        }

        .current-time-label {
            position: absolute; top: -25px; transform: translateX(-50%); font-size: 0.9em;
            font-weight: 500; color: #AA8A5A; background-color: rgba(10, 10, 10, 0.8);
            padding: 2px 6px; border-radius: 3px;
        }
        
        .time-scale {
            position: absolute; bottom: 0; width: 100%; height: 20%;
            display: flex; justify-content: space-between;
        }

        .time-scale-label {
            font-size: 0.7em; opacity: 0.5; text-align: center;
            flex-basis: calc(100% / 12); /* 12 etiquetas para 24 horas (cada 2 horas) */
        }
    </style>
</head>
<body>
    <div class="gantt-container">
        <div class="panel-title">Global Sessions</div>
        <div class="timeline-area">
            <div class="sessions-grid"></div>
            <div class="current-time-indicator"><div class="current-time-label"></div></div>
        </div>
        <div class="time-scale"></div>
    </div>

    <script>
        const sessions = [
            { name: 'Sydney', timezone: 'Australia/Sydney', start: 8, end: 17, top: 10 },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', start: 9, end: 18, top: 50 },
            { name: 'London', timezone: 'Europe/London', start: 8, end: 17, top: 90 },
            { name: 'New York', timezone: 'America/New_York', start: 8, end: 17, top: 130 }
        ];

        function getUTCHour(timezone, localHour) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-CA', {timeZone: timezone}); // YYYY-MM-DD
            const timeStr = String(localHour).padStart(2, '0') + ':00:00';
            const dateTimeStr = `${dateStr}T${timeStr}`;
            
            // Crear fecha en la zona horaria de la sesión, luego obtener la hora UTC
            const localDate = new Date(dateTimeStr);
            const tzOffset = new Date().toLocaleString("en-US", {timeZone: timezone, timeZoneName: "short"}).split('GMT')[1];
            const offsetHours = parseInt(tzOffset.slice(0,3));
            
            // Esto es una simplificación, pero más robusta para este caso
            const tempDate = new Date(`2000-01-01T${timeStr}${tzOffset}`);
            return tempDate.getUTCHours();
        }

        function drawTimeline() {
            const gridContainer = document.querySelector('.sessions-grid');
            const timeScaleContainer = document.querySelector('.time-scale');
            const indicator = document.querySelector('.current-time-indicator');
            const indicatorLabel = document.querySelector('.current-time-label');

            gridContainer.innerHTML = '';
            
            const allIntervals = [];

            sessions.forEach(session => {
                const startUTC = getUTCHour(session.timezone, session.start);
                let endUTC = getUTCHour(session.timezone, session.end);
                
                // Si la sesión cruza la medianoche UTC
                if (endUTC < startUTC) {
                    // Barra hasta la medianoche
                    let left1 = (startUTC / 24) * 100;
                    let width1 = ((24 - startUTC) / 24) * 100;
                    allIntervals.push({start: startUTC, end: 24, top: session.top, name: session.name});
                    
                    // Barra desde la medianoche
                    let left2 = 0;
                    let width2 = (endUTC / 24) * 100;
                    allIntervals.push({start: 0, end: endUTC, top: session.top, name: session.name});

                } else {
                    let left = (startUTC / 24) * 100;
                    let width = ((endUTC - startUTC) / 24) * 100;
                    allIntervals.push({start: startUTC, end: endUTC, top: session.top, name: session.name});
                }
            });

            // Dibujar barras principales
            allIntervals.forEach(interval => {
                const bar = document.createElement('div');
                bar.className = 'session-bar';
                bar.style.left = `${(interval.start / 24) * 100}%`;
                bar.style.width = `${((interval.end - interval.start) / 24) * 100}%`;
                bar.style.top = `${interval.top}px`;
                bar.textContent = interval.name;
                gridContainer.appendChild(bar);
            });
            
            // Detectar y dibujar solapamientos
            for (let i = 0; i < allIntervals.length; i++) {
                for (let j = i + 1; j < allIntervals.length; j++) {
                    const a = allIntervals[i];
                    const b = allIntervals[j];
                    const overlapStart = Math.max(a.start, b.start);
                    const overlapEnd = Math.min(a.end, b.end);

                    if (overlapStart < overlapEnd) {
                        const overlapBar = document.createElement('div');
                        overlapBar.className = 'session-bar overlap';
                        overlapBar.style.left = `${(overlapStart / 24) * 100}%`;
                        overlapBar.style.width = `${((overlapEnd - overlapStart) / 24) * 100}%`;
                        overlapBar.style.top = `${a.top}px`;
                        gridContainer.appendChild(overlapBar);

                        const overlapBarB = document.createElement('div');
                        overlapBarB.className = 'session-bar overlap';
                        overlapBarB.style.left = `${(overlapStart / 24) * 100}%`;
                        overlapBarB.style.width = `${((overlapEnd - overlapStart) / 24) * 100}%`;
                        overlapBarB.style.top = `${b.top}px`;
                        gridContainer.appendChild(overlapBarB);
                    }
                }
            }

            // Actualizar indicador de tiempo actual
            const nowUTC = new Date();
            const currentUTCHour = nowUTC.getUTCHours() + (nowUTC.getUTCMinutes() / 60);
            const indicatorPosition = (currentUTCHour / 24) * 100;
            indicator.style.left = `${indicatorPosition}%`;
            indicatorLabel.textContent = nowUTC.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit' }) + ' UTC';
            indicatorLabel.style.left = `${indicatorPosition}%`;

            // Dibujar escala de tiempo
            timeScaleContainer.innerHTML = '';
            for (let i = 0; i < 24; i += 2) {
                const label = document.createElement('div');
                label.className = 'time-scale-label';
                label.textContent = String(i).padStart(2, '0') + ':00';
                timeScaleContainer.appendChild(label);
            }
        }
        
        drawTimeline();
        setInterval(drawTimeline, 60000); // Actualiza cada minuto

    </script>
</body>
</html>
