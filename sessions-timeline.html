<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definitive Sessions Timeline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            background-color: transparent; margin: 0; font-family: 'Roboto Mono', monospace;
            color: #EAEAEA; overflow: hidden; display: flex; justify-content: center;
            align-items: center; height: 100vh;
        }

        .matrix-container {
            width: 100%; height: 100%; max-width: 1200px; padding: 25px 40px;
            box-sizing: border-box; background-color: rgba(10, 10, 10, 0.7);
            border: 1px solid #282828; border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex; flex-direction: column;
        }
        
        .panel-title {
            font-family: 'Lora', serif; font-size: 1.2em; letter-spacing: 3px;
            text-transform: uppercase; color: #AA8A5A; text-align: center;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #282828;
        }

        .timeline-area {
            position: relative; width: 100%; flex-grow: 1;
        }

        .sessions-grid {
            position: relative; height: 80%;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: calc(100% / 24) 100%;
        }

        .session-bar {
            position: absolute; height: 30px; background-color: #333;
            border-radius: 4px; display: flex; align-items: center;
            padding-left: 10px; box-sizing: border-box; font-family: 'Lora', serif;
            font-size: 0.8em; color: #EAEAEA;
        }
        
        .overlap {
            background-color: #E5E4E2; color: #111; font-weight: bold; z-index: 10;
        }

        .current-time-indicator {
            position: absolute; left: 50%; top: 0; height: 80%; width: 2px;
            background-color: #AA8A5A; box-shadow: 0 0 10px #AA8A5A; z-index: 20;
        }

        .current-time-label {
            position: absolute; left: 50%; top: -25px; transform: translateX(-50%);
            font-size: 0.9em; font-weight: 500; color: #AA8A5A;
            background-color: rgba(10, 10, 10, 0.8); padding: 2px 6px; border-radius: 3px;
        }
        
        .time-scale {
            position: absolute; bottom: 0; width: 100%; height: 20%;
        }
        .time-scale-label {
            font-size: 0.7em; opacity: 0.5; text-align: center;
            position: absolute; transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="matrix-container">
        <div class="panel-title">Global Sessions</div>
        <div class="timeline-area">
            <div class="sessions-grid"></div>
            <div class="current-time-indicator"><div class="current-time-label"></div></div>
        </div>
        <div class="time-scale"></div>
    </div>

    <script>
        const sessions = [
            { name: 'Sydney', timezone: 'Australia/Sydney', start: 8, end: 17, top: 90 },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', start: 9, end: 18, top: 130 },
            { name: 'London', timezone: 'Europe/London', start: 8, end: 17, top: 10 },
            { name: 'New York', timezone: 'America/New_York', start: 8, end: 17, top: 50 }
        ];

        // --- NEW, ROBUST TIMEZONE LOGIC ENGINE ---

        function getCurrentDateInTimezone(timezone) {
            const date = new Date();
            const year = date.toLocaleString('en-US', { timeZone: timezone, year: 'numeric' });
            const month = date.toLocaleString('en-US', { timeZone: timezone, month: '2-digit' });
            const day = date.toLocaleString('en-US', { timeZone: timezone, day: '2-digit' });
            const hour = date.toLocaleString('en-US', { timeZone: timezone, hour: '2-digit', hour12: false });
            return { year, month, day, hour: parseInt(hour) };
        }

        function getSessionInstances(session) {
            const instances = [];
            [-1, 0, 1].forEach(dayOffset => { // Check yesterday, today, and tomorrow
                const refDate = getCurrentDateInTimezone(session.timezone);
                const sessionDate = new Date(`${refDate.year}-${refDate.month}-${refDate.day}T00:00:00`);
                sessionDate.setDate(sessionDate.getDate() + dayOffset);

                const start = new Date(sessionDate);
                start.setHours(session.start);

                const end = new Date(sessionDate);
                end.setHours(session.end);

                // Re-create date from parts to ensure timezone correctness
                const finalStart = new Date(start.toLocaleString("en-US", {timeZone: session.timezone}));
                const finalEnd = new Date(end.toLocaleString("en-US", {timeZone: session.timezone}));

                instances.push({
                    start: finalStart,
                    end: finalEnd,
                    top: session.top,
                    name: session.name
                });
            });
            return instances;
        }

        function drawTimeline() {
            const gridContainer = document.querySelector('.sessions-grid');
            const timeScaleContainer = document.querySelector('.time-scale');
            const indicatorLabel = document.querySelector('.current-time-label');

            gridContainer.innerHTML = '';

            const now = new Date();
            const timelineStart = new Date(now.getTime() - 12 * 60 * 60 * 1000);
            const timelineEnd = new Date(now.getTime() + 12 * 60 * 60 * 1000);
            const timelineDuration = timelineEnd - timelineStart;

            const visibleIntervals = [];

            sessions.forEach(session => {
                getSessionInstances(session).forEach(instance => {
                    if (instance.start < timelineEnd && instance.end > timelineStart) {
                        const left = Math.max(0, ((instance.start - timelineStart) / timelineDuration) * 100);
                        const right = Math.min(100, ((instance.end - timelineStart) / timelineDuration) * 100);
                        const width = right - left;

                        if (width > 0) {
                            const bar = document.createElement('div');
                            bar.className = 'session-bar';
                            bar.style.left = `${left}%`;
                            bar.style.width = `${width}%`;
                            bar.style.top = `${instance.top}px`;
                            bar.textContent = instance.name;
                            gridContainer.appendChild(bar);
                            visibleIntervals.push({ ...instance, bar });
                        }
                    }
                });
            });

            // Detect and draw overlaps
            for (let i = 0; i < visibleIntervals.length; i++) {
                for (let j = i + 1; j < visibleIntervals.length; j++) {
                    const a = visibleIntervals[i];
                    const b = visibleIntervals[j];
                    const overlapStart = Math.max(a.start, b.start);
                    const overlapEnd = Math.min(a.end, b.end);

                    if (overlapStart < overlapEnd) {
                        const left = ((overlapStart - timelineStart) / timelineDuration) * 100;
                        const width = ((overlapEnd - overlapStart) / timelineDuration) * 100;
                        
                        [a, b].forEach(interval => {
                             const overlapBar = document.createElement('div');
                             overlapBar.className = 'session-bar overlap';
                             overlapBar.style.left = `${left}%`;
                             overlapBar.style.width = `${width}%`;
                             overlapBar.style.top = `${interval.top}px`;
                             gridContainer.appendChild(overlapBar);
                        });
                    }
                }
            }
            
            indicatorLabel.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

            // Draw time scale
            timeScaleContainer.innerHTML = '';
            for (let h = -12; h <= 12; h++) {
                if (h % 2 === 0) {
                    const labelDate = new Date(now.getTime() + h * 60 * 60 * 1000);
                    const position = ((labelDate - timelineStart) / timelineDuration) * 100;
                    
                    const label = document.createElement('div');
                    label.className = 'time-scale-label';
                    label.style.left = `${position}%`;
                    label.textContent = labelDate.toLocaleTimeString('en-GB', { hour: '2-digit'}) + ':00';
                    timeScaleContainer.appendChild(label);
                }
            }
        }
        
        drawTimeline();
        setInterval(drawTimeline, 60000); // Update every minute
    </script>
</body>
</html>
