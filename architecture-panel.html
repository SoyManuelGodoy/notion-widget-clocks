<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter:wght@400;500&display=swap');

        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .architecture-panel {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            width: 100%;
            max-width: 1200px;
            padding: 25px 20px;
            background-color: #0D1B2A; /* Azul Medianoche */
            border: 1px solid rgba(0, 87, 255, 0.3); /* Borde Azul Cobalto sutil */
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 87, 255, 0.2); /* Sutil brillo azul */
        }

        .clock-module {
            text-align: center;
            flex-grow: 1;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .location-name {
            font-family: 'Poppins', sans-serif; /* <-- Tipografía Profesional */
            font-size: 1.1em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #E1E5EA; /* Blanco Titanio */
            margin-bottom: 20px;
        }

        .time {
            font-family: 'Inter', sans-serif; /* <-- Tipografía de Datos */
            font-size: 2.5em;
            font-weight: 500;
            color: #0057FF; /* <-- Azul Cobalto */
            line-height: 1;
        }
        
        .date {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.9em;
            color: #E1E5EA;
            opacity: 0.6;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="architecture-panel">
        <!-- El resto del HTML (divs y script) es idéntico al de Obsidian Deck -->
        <div class="clock-module">
            <div class="location-name">Tokio</div>
            <div id="tokio-time" class="time"></div>
            <div id="tokio-date" class="date"></div>
        </div>
        <div class="clock-module">
            <div class="location-name">London</div>
            <div id="london-time" class="time"></div>
            <div id="london-date" class="date"></div>
        </div>
        <div class="clock-module">
            <div class="location-name">New York</div>
            <div id="ny-time" class="time"></div>
            <div id="ny-date" class="date"></div>
        </div>
    </div>
    <script>
        function updateClock(timeElementId, dateElementId, timezone) {
            const now = new Date(new Date().toLocaleString('en-US', { timeZone: timezone }));
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const day = now.toLocaleDateString('en-US', { weekday: 'short' });
            const month = now.toLocaleDateString('en-US', { month: 'short' });
            const dayNum = now.getDate();
            document.getElementById(timeElementId).textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById(dateElementId).textContent = `${day}, ${month} ${dayNum}`;
        }
        function initializeClocks() {
            updateClock('tokio-time', 'tokio-date', 'Asia/Tokyo');
            updateClock('london-time', 'london-date', 'Europe/London');
            updateClock('ny-time', 'ny-date', 'America/New_York');
        }
        setInterval(initializeClocks, 1000);
        initializeClocks();
    </script>
</body>
</html>
